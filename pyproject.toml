[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citeqc"
version = "0.1.1"
description = "Measure protein-mRNA coupling in CITE-seq data, and check the analysis for artefacts that produce false positives."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Elmasnur Yılmaz", email = "elmasnrylmz@gmail.com" }]
keywords = ["CITE-seq", "single-cell", "multimodal", "quality-control", "ADT"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
anndata = ["anndata>=0.9", "mudata>=0.2"]
test = ["pytest>=7"]

[project.scripts]
citeqc = "citeqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citeqc = ["data/*.tsv"]
